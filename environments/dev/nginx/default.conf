upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:8080;
}

upstream ai {
    server ai:8000;
}

server {
    listen 80;
    server_name dhkiss01.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dhkiss01.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/dhkiss01.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dhkiss01.p-e.kr/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://frontend;
    }

    location /api {
        proxy_pass http://backend;
    }

    location /internal {
        proxy_pass http://backend;
    }

    # Cloud Tasks: retain /internal/tasks/ for the AI worker handler.
    location ^~ /internal/tasks/ {
        proxy_pass http://ai;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
    }

    location /ai/ {
        proxy_pass http://ai/;
    }
}
